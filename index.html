    <style>
        :root {

        .btn-gld {
            background: linear-gradient(135deg, var(--gold-main) 0%, var(--gold-dark) 100%);
            color: var(--emerald-bg);
            font-weight: 800;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--gold-light);
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-gld::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;

        .btn-gld:hover, .btn-gld:focus-visible {

        @media (prefers-reduced-motion: reduce) {

        }

        .reveal-on-scroll { opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .is-visible { opacity: 1; transform: translateY(0); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .text-stroke-gld { color: transparent; -webkit-text-stroke: 1px rgba(197, 160, 89, 0.4); }
        .ambient-light { background: radial-gradient(circle, rgba(197,160,89,0.1) 0%, transparent 60%); }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Custom Hook: Intersection Observer (Performance & Clean Architecture)
        const useIntersectionObserver = (options = { threshold: 0.1, triggerOnce: true }) => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            if(options.triggerOnce) observer.unobserve(entry.target);
                        }
                    });
                }, options);
                
                const elements = document.querySelectorAll('.reveal-on-scroll');
                elements.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [options]);
        };

        const WhatsAppIcon = () => (
            <svg viewBox="0 0 24 24" className="w-8 h-8 fill-white relative z-10" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.031 0C5.385 0 0 5.387 0 12.035c0 2.124.553 4.195 1.604 6.01L.062 24l6.105-1.602A11.97 11.97 0 0012.031 24c6.646 0 12.035-5.387 12.035-12.035C24.066 5.387 18.677 0 12.031 0zm7.11 17.382c-.328.918-1.921 1.765-2.656 1.834-.702.065-1.57.172-4.992-1.258-4.04-1.693-6.666-5.836-6.868-6.108-.202-.271-1.642-2.189-1.642-4.175 0-1.986 1.033-2.96 1.399-3.29.366-.33.801-.413 1.066-.413.265 0 .53.003.762.015.244.012.571-.097.893.684.336.818 1.082 2.656 1.182 2.862.1.205.166.446.033.717-.133.271-.2.436-.4.664-.199.228-.415.485-.598.68-.199.208-.412.435-.18.825.231.391 1.026 1.688 2.197 2.668 1.514 1.267 2.766 1.662 3.163 1.855.397.193.632.164.866-.098.234-.262 1.011-1.185 1.284-1.592.273-.407.545-.34.908-.236.363.102 2.302 1.087 2.698 1.285.397.198.662.297.762.462.099.165.099.957-.229 1.875z"/>
            </svg>
        );

        // Ícone da Marca: Gravata Vermelha de Alta Costura
        const RedTieIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" className={className || "w-8 h-8"} fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M10 2H14L13.5 6H10.5L10 2Z" fill="#DC2626" />
                <path d="M10.5 6.5H13.5L15.5 19L12 23.5L8.5 19L10.5 6.5Z" fill="#991B1B" />
            </svg>
        );

        // Componente LGPD (Cookies)
        const CookieConsent = () => {
            const [show, setShow] = useState(false);
            useEffect(() => {
                if(!localStorage.getItem('vanguard_gld_cookies')) setShow(true);
            }, []);
            
            if(!show) return null;
            return (
                <div className="fixed bottom-6 left-6 z-[300] bg-[var(--emerald-surface)] border border-[var(--gold-main)]/30 p-6 rounded-lg shadow-2xl max-w-sm" role="dialog" aria-live="polite">
                    <h4 className="text-sm font-bold text-white mb-2 font-tech">O Padrão de Privacidade</h4>
                    <p className="text-[10px] text-gray-400 mb-4 leading-relaxed">Utilizamos cookies rigorosamente necessários para elevar a sua experiência. A sua discrição é o nosso compromisso.</p>
                    <div className="flex gap-4">
                        <button onClick={() => { localStorage.setItem('vanguard_gld_cookies', 'true'); setShow(false); }} className="btn-gld px-6 py-2 rounded-sm text-[10px] uppercase font-bold tracking-[0.2em]">Aceitar</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showToast, setShowToast] = useState(true);
            const [deviceIQ, setDeviceIQ] = useState({ isLowEnd: false, isMobile: false });
            const trendsRef = useRef(null);
            
            useIntersectionObserver();

            // Auditoria Hardware e Events
            useEffect(() => {
                const checkDevice = () => {
                    const ram = navigator.deviceMemory || 4;
                    const cores = navigator.hardwareConcurrency || 4;
                    setDeviceIQ({ isLowEnd: ram < 4 || cores < 4, isMobile: window.innerWidth <= 768 });
                };
                checkDevice();
                window.addEventListener('resize', checkDevice);

                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll, { passive: true });

                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && mobileMenuOpen) setMobileMenuOpen(false);
                };
                window.addEventListener('keydown', handleKeyDown);
                
                const toastTimer = setTimeout(() => setShowToast(false), 8000);

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('resize', checkDevice);
                    window.removeEventListener('keydown', handleKeyDown);
                    clearTimeout(toastTimer);
                };
            }, [mobileMenuOpen]);

            useEffect(() => {
                document.body.style.overflow = mobileMenuOpen ? 'hidden' : 'unset';
            }, [mobileMenuOpen]);

            // Draggable Slider Logic
            let isDown = false;
            let startX;
            let scrollLeft;
            const handleMouseDown = (e) => {
                isDown = true;
                startX = e.pageX - trendsRef.current.offsetLeft;
                scrollLeft = trendsRef.current.scrollLeft;
            };
            const handleMouseLeave = () => { isDown = false; };
            const handleMouseUp = () => { isDown = false; };
            const handleMouseMove = (e) => {
                if(!isDown) return;
                e.preventDefault();
                const x = e.pageX - trendsRef.current.offsetLeft;
                const walk = (x - startX) * 2; 
                trendsRef.current.scrollLeft = scrollLeft - walk;
            };

            const scrollTrends = (dir) => {
                if (trendsRef.current) {
                    const offset = dir === 'left' ? -350 : 350;
                    trendsRef.current.scrollBy({ left: offset, behavior: 'smooth' });
                }
            };

            const services = [
                { title: "Corte & Visagismo", price: "80", desc: "Análise facial e corte geométrico estruturado.", img: "https://images.unsplash.com/photo-1621605815841-aa88c82100bb?w=800" },
                { title: "Barboterapia GLD", price: "70", desc: "Toalhas quentes, óleos botânicos e finalização.", img: "https://images.unsplash.com/photo-1593702295094-ada35bc19ad7?w=800" },
                { title: "Sessão Vanguard", price: "140", desc: "O ritual absoluto: Corte, Barba e Alinhamento.", img: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800" }
            ];

            const WAMessage = encodeURIComponent("Olá Vanguard, gostaria de agendar uma sessão premium GLD.");
            const WALink = `https://wa.me/5549999999999?text=${WAMessage}`;

            return (
                <div className="min-h-screen">
                    <CookieConsent />

                    {showToast && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[110] gld-toast rounded-full px-6 py-3 flex items-center gap-4 cursor-pointer hover:bg-[var(--emerald-surface)] transition-colors" onClick={() => setShowToast(false)} role="alert">
                            <i data-lucide="shield-check" className="w-4 h-4 text-[#C5A059]" aria-hidden="true"></i>
                            <span className="text-[9px] md:text-[10px] uppercase tracking-[0.3em] text-gray-200 font-medium">GLD Concierge: <span className="text-white font-bold ml-1">Sessões limitadas disponíveis</span></span>
                            <button aria-label="Fechar notificação" className="ml-2 text-[#C5A059] hover:text-white"><i data-lucide="x" className="w-3 h-3"></i></button>
                        </div>
                    )}

                    <header className={`fixed top-0 w-full z-[100] transition-all duration-700 ${isScrolled ? 'glass-emerald py-4' : 'py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-sm border border-red-900/30 flex items-center justify-center bg-red-950/20 shadow-[0_0_15px_rgba(220,38,38,0.15)]">
                                    <RedTieIcon className="w-5 h-5" />
                                </div>
                                <div className="flex flex-col">
                                    <h1 className="text-[14px] font-black tracking-[0.3em] uppercase leading-none text-white drop-shadow-md m-0">VANGUARD</h1>
                                    <span className="text-[9px] font-bold tracking-[0.4em] text-brushed-gold uppercase leading-tight mt-1">GLD Studio</span>
                                </div>
                            </div>
                            
                            <nav className="hidden lg:flex gap-10" aria-label="Navegação Principal">
                                {['O Estúdio', 'Catálogo', 'Arquitetura', 'Aliança'].map((item) => (
                                    <a key={item} href={`#${item.toLowerCase().replace(' ', '').replace('o', '')}`} className="text-[10px] uppercase tracking-[0.3em] text-gray-300 hover:text-[#C5A059] transition-colors focus-visible:outline focus-visible:outline-[#C5A059] p-1">{item}</a>
                                ))}
                                <a href={WALink} className="text-[10px] uppercase tracking-[0.3em] font-bold text-[#C5A059] hover:text-white transition-colors">Agendar</a>
                            </nav>

                            <button onClick={() => setMobileMenuOpen(true)} className="lg:hidden flex items-center gap-3 group" aria-label="Abrir Menu" aria-expanded={mobileMenuOpen}>
                                <div className="p-3 border border-[#C5A059]/30 rounded-full group-hover:border-[#C5A059] transition-all bg-[var(--emerald-surface)] focus-visible:outline focus-visible:outline-[#C5A059]">
                                    <i data-lucide="menu" className="w-5 h-5 text-[#C5A059]" aria-hidden="true"></i>
                                </div>
                            </button>
                        </div>
                    </header>

                    <div className={`fixed inset-0 z-[150] transition-all duration-[800ms] cubic-bezier(0.16, 1, 0.3, 1) ${mobileMenuOpen ? 'opacity-100 visible' : 'opacity-0 invisible'}`} 
                         style={{background: 'rgba(2, 20, 12, 0.95)', backdropFilter: deviceIQ.isLowEnd ? 'none' : 'blur(30px)'}}>
                        <div className="flex justify-end p-6 md:p-10">
                            <button onClick={() => setMobileMenuOpen(false)} aria-label="Fechar Menu" className="p-3 border border-[#C5A059]/50 rounded-full hover:bg-[#C5A059]/20 transition-colors focus-visible:outline focus-visible:outline-[#C5A059]">
                                <i data-lucide="x" className="w-6 h-6 text-[#C5A059]" aria-hidden="true"></i>
                            </button>
                        </div>
                        <nav className="flex flex-col items-center justify-center h-full gap-8 pb-20">
                            <span className="text-[10px] tracking-[0.5em] text-[#C5A059] uppercase mb-4 drop-shadow-lg">Acesso Exclusivo</span>
                            {['O ESTÚDIO', 'CATÁLOGO', 'ARQUITETURA', 'PORTFÓLIO'].map((item, i) => (
                                <a key={item} href={`#${item.toLowerCase().replace(' ', '').replace('o', '')}`} onClick={(e) => { setMobileMenuOpen(false); }} className="text-4xl md:text-5xl font-editorial italic text-white hover:text-[#C5A059] transition-colors focus-visible:outline focus-visible:outline-[#C5A059] p-2" style={{transitionDelay: `${i * 0.1}s`}}>{item}</a>
                            ))}
                        </nav>
                    </div>

                    <main>
                        <section id="estúdio" className="relative h-[100dvh] flex flex-col justify-end pb-24 md:pb-32 px-6 overflow-hidden">
                            <div className="absolute top-1/4 left-1/4 w-[50vw] h-[50vw] ambient-light rounded-full mix-blend-screen -z-10" aria-hidden="true"></div>
                            
                            <div className="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
                                <div className="w-[90vw] h-[75vh] md:w-[50vw] md:h-[85vh] rounded-[200px] md:rounded-[500px] overflow-hidden border border-[#C5A059]/20 opacity-70 shadow-[0_0_60px_rgba(197,160,89,0.15)]">
                                    <img src="https://projetobarber2026.carrd.co/assets/images/image01.jpg?v=1af6d300" alt="Mestre Barbeiro em estúdio executando alinhamento" className="w-full h-full object-cover grayscale object-center scale-110 contrast-125 mix-blend-luminosity select-none" />
                                </div>
                                <div className="absolute inset-0 bg-gradient-to-t from-[var(--emerald-bg)] via-[var(--emerald-bg)]/60 to-transparent"></div>
                            </div>
                            
                            <div className="relative z-10 max-w-7xl mx-auto w-full flex flex-col items-center text-center">
                                <div className="reveal-on-scroll flex flex-col items-center">
                                    <span className="text-[10px] md:text-[11px] tracking-[0.5em] text-[#C5A059] uppercase mb-4 drop-shadow-md font-bold">O Padrão Absoluto</span>
                                    <h2 className="text-[14vw] md:text-[8vw] font-editorial italic leading-[0.9] mb-6 text-white drop-shadow-2xl">
                                        A Arte da <br className="md:hidden" />
                                        <span className="font-sans not-italic font-black text-brushed-gold tracking-tighter drop-shadow-lg ml-0 md:ml-4">EXCELÊNCIA.</span>
                                    </h2>
                                    <p className="max-w-md text-[10px] md:text-xs tracking-[0.3em] text-[#A7C2B4] uppercase leading-relaxed mb-10 drop-shadow-sm">
                                        O estúdio definitivo em Chapecó. Engenharia facial para o homem que exige o absoluto.
                                    </p>
                                    <a href={WALink} className="btn-gld px-14 py-5 rounded-sm text-[10px] md:text-xs tracking-[0.4em] uppercase inline-block font-bold">
                                        Agendar Sessão
                                    </a>
                                </div>
                            </div>
                        </section>

                        <div className="bg-[var(--emerald-surface)] py-6 overflow-hidden relative z-20 border-y border-[var(--emerald-border)]">
                            <div className="animate-marquee items-center gap-12 hover:[animation-play-state:paused] transition-all whitespace-nowrap flex-nowrap">
                                {[1,2,3,4].map(i => (
                                    <div key={i} className="flex items-center gap-12 md:gap-16 min-w-max px-4 md:px-8" aria-hidden={i !== 1}>
                                        <span className="text-[10px] md:text-sm font-bold tracking-[0.3em] uppercase text-[#F4E4C1]">Estética de Poder</span>
                                        <span className="text-xl md:text-3xl font-editorial italic text-stroke-gld uppercase tracking-widest text-[#059669]">Confiança Inabalável</span>
                                        <span className="text-[10px] md:text-sm font-bold tracking-[0.3em] uppercase text-[#F4E4C1]">Alta Performance Visual</span>
                                        <i data-lucide="crown" className="w-5 h-5 md:w-6 md:h-6 text-[#C5A059]"></i>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <section id="portfólio" className="py-32 md:py-48 px-6 bg-[var(--emerald-surface)] border-b border-[var(--emerald-border)]">
                            <div className="max-w-7xl mx-auto mb-20 flex flex-col md:flex-row justify-between items-start md:items-end gap-8 reveal-on-scroll">
                                <div>
                                    <span className="text-[10px] tracking-[0.4em] text-[#C5A059] uppercase block mb-4">A Galeria</span>
                                    <h2 className="text-5xl md:text-6xl font-editorial italic">Portfólio GLD</h2>
                                </div>
                                <div className="flex gap-4">
                                    <button aria-label="Deslizar galeria para a esquerda" onClick={() => scrollTrends('left')} className="p-5 rounded-full border border-[var(--emerald-border)] bg-[var(--emerald-bg)] hover:border-[#C5A059] transition-all focus-visible:outline focus-visible:outline-[#C5A059]">
                                        <i data-lucide="chevron-left" className="w-5 h-5 text-[#C5A059]"></i>
                                    </button>
                                    <button aria-label="Deslizar galeria para a direita" onClick={() => scrollTrends('right')} className="p-5 rounded-full border border-[var(--emerald-border)] bg-[var(--emerald-bg)] hover:border-[#C5A059] transition-all focus-visible:outline focus-visible:outline-[#C5A059]">
                                        <i data-lucide="chevron-right" className="w-5 h-5 text-[#C5A059]"></i>
                                    </button>
                                </div>
                            </div>

                            <div ref={trendsRef} 
                                 className="flex gap-8 overflow-x-auto scrollbar-hide snap-x reveal-on-scroll cursor-grab active:cursor-grabbing"
                                 onMouseDown={handleMouseDown} onMouseLeave={handleMouseLeave} onMouseUp={handleMouseUp} onMouseMove={handleMouseMove}>
                                {[
                                    { img: "https://projetobarber2026.carrd.co/assets/images/image02.jpg?v=ec553877", t: "DEGRADÊ NAVALHADO", d: "Skin Fade Perfeito", alt: "Corte masculino Degradê Navalhado" },
                                    { img: "https://projetobarber2026.carrd.co/assets/images/image03.jpg?v=ec553877", t: "SOCIAL EXECUTIVO", d: "Alta Costura em Tesoura", alt: "Corte clássico Social Executivo" },
                                    { img: "https://projetobarber2026.carrd.co/assets/images/image01.jpg?v=1af6d300", t: "CROP TEXTURIZADO", d: "Geometria de Vanguarda", alt: "Corte vanguardista Crop Texturizado" }
                                ].map((item, idx) => (
                                    <article key={idx} className="min-w-[85vw] md:min-w-[450px] snap-center">
                                        <div className="relative aspect-[4/5] overflow-hidden rounded-xl border border-[var(--emerald-border)] group shadow-2xl" onContextMenu={(e) => e.preventDefault()}>
                                            <img src={item.img} alt={item.alt} loading="lazy" decoding="async" className="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-[1.5s] select-none" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-[var(--emerald-bg)] via-[var(--emerald-bg)]/50 to-transparent pointer-events-none"></div>
                                            <div className="absolute bottom-0 w-full p-8 md:p-10 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500 pointer-events-none">
                                                <span className="text-[9px] tracking-[0.4em] text-[#C5A059] uppercase block mb-3 font-bold">{item.d}</span>
                                                <h3 className="text-2xl md:text-3xl font-editorial italic tracking-wide">{item.t}</h3>
                                            </div>
                                        </div>
                                    </article>
                                ))}

                            </span>
                            <div className="flex gap-8">

                    <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} aria-label="Voltar ao topo" className={`fixed bottom-28 right-8 z-[190] w-10 h-10 bg-[var(--emerald-surface)] border border-[var(--gold-main)]/30 rounded-full flex items-center justify-center shadow-lg transition-all duration-500 hover:bg-[var(--gold-main)]/10 focus-visible:outline focus-visible:outline-[#C5A059] ${isScrolled ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                        <i data-lucide="chevron-up" className="w-5 h-5 text-[#C5A059]"></i>

                    {/* FAB WHATSAPP */}
                    <a href={WALink} aria-label="Falar com Vanguard no WhatsApp" className="fixed bottom-8 right-8 z-[200] w-16 h-16 bg-[var(--emerald-pop)] rounded-full flex items-center justify-center shadow-[0_10px_30px_rgba(5,150,105,0.4)] hover:scale-110 transition-transform border border-emerald-300/30 group focus-visible:outline focus-visible:outline-[#C5A059]">
                        <WhatsAppIcon />
                    </a>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Timeout para garantir que os ícones lucide renderizam após o React virtual DOM
        setTimeout(() => lucide.createIcons(), 500);
