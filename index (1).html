<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Hook: Intersection Observer
        const useIntersectionObserver = (options = { threshold: 0.1, triggerOnce: true }) => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            if(options.triggerOnce) observer.unobserve(entry.target);
                        }
                    });
                }, options);
                
                const elements = document.querySelectorAll('.reveal-on-scroll');
                elements.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [options]);
        };

        const RedTieIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" className={className || "w-8 h-8"} fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M10 2H14L13.5 6H10.5L10 2Z" fill="#DC2626" />
                <path d="M10.5 6.5H13.5L15.5 19L12 23.5L8.5 19L10.5 6.5Z" fill="#991B1B" />
            </svg>
        );

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isPastHero, setIsPastHero] = useState(false);
            const [showFab, setShowFab] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [deviceIQ, setDeviceIQ] = useState({ isLowEnd: false, isMobile: false });
            
            useIntersectionObserver();

            // CORREÇÃO DE BUG: Garante que os ícones renderizam sempre que o React atualiza a tela
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            useEffect(() => {
                const handleScroll = () => {
                    const y = window.scrollY;
                    const pastHero = y > window.innerHeight * 0.85;
                    setIsScrolled(y > 50);
                    setIsPastHero(pastHero);
                    setShowFab(pastHero);
                };
                const checkDevice = () => {
                    const ram = navigator.deviceMemory || 4;
                    const cores = navigator.hardwareConcurrency || 4;
                    setDeviceIQ({ isLowEnd: ram < 4 || cores < 4, isMobile: window.innerWidth <= 768 });
                };
                checkDevice();
                handleScroll();
                window.addEventListener('resize', checkDevice);
                window.addEventListener('scroll', handleScroll, { passive: true });

                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && mobileMenuOpen) setMobileMenuOpen(false);
                };
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('resize', checkDevice);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [mobileMenuOpen]);

            useEffect(() => {
                document.body.style.overflow = mobileMenuOpen ? 'hidden' : 'unset';
            }, [mobileMenuOpen]);

            // Imagem local do hero / avaliações
            const HERO_IMAGE = "assets/images/hero/hero-barber.jpg";
            const portfolioItems = [
                { img: "https://projetobarber2026.carrd.co/assets/images/image02.jpg?v=ec553877", t: "DEGRADÊ NAVALHADO", d: "Skin Fade Perfeito", alt: "Corte Degradê Navalhado" },
                { img: "https://projetobarber2026.carrd.co/assets/images/image03.jpg?v=ec553877", t: "SOCIAL EXECUTIVO", d: "Alta Costura em Tesoura", alt: "Corte clássico Social Executivo" },
                { img: HERO_IMAGE, t: "CROP TEXTURIZADO", d: "Geometria de Vanguarda", alt: "Corte Crop Texturizado" },
                { img: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&q=80&w=800", t: "POMPADOUR CLÁSSICO", d: "Volume & Presença", alt: "Corte Pompadour Clássico" },
                { img: "https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&q=80&w=800", t: "TAPER FADE", d: "Acabamento Milimétrico", alt: "Corte Taper Fade" },
                { img: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&q=80&w=800", t: "MULLET MODERNO", d: "A Tendência 2026", alt: "Corte Mullet Moderno" },
                { img: "https://images.unsplash.com/photo-1621605815841-aa88c82100bb?auto=format&fit=crop&q=80&w=800", t: "BUZZ CUT", d: "Atitude & Precisão", alt: "Corte Buzz Cut" }
            ];

            const services = [
                { title: "Corte Executivo", price: "80", desc: "Corte na tesoura e máquina, acabamento alinhado ao seu rosto.", img: "https://images.unsplash.com/photo-1621605815841-aa88c82100bb?w=800" },
                { title: "Barboterapia Premium", price: "70", desc: "Barba com toalha quente, navalha e finalização com balm.", img: "https://images.unsplash.com/photo-1593702295094-ada35bc19ad7?w=800" },
                { title: "Pacote Completo", price: "140", desc: "Corte + barba + sobrancelha. O combo mais pedido da casa.", img: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800" }
            ];

            const WA_MSG = "Olá, quero agendar um horário na Imperium Barber.";
            const generateWALink = (message) => `https://wa.me/5549999999999?text=${encodeURIComponent(message)}`;

            return (
                <div className="min-h-screen relative">
                    
                    {/* NAVBAR - VIDRO ESMERALDA PERMANENTE DESDE A ENTRADA */}
                    <header className={`fixed top-0 w-full z-[100] transition-all duration-700 glass-emerald ${isScrolled ? 'py-4' : 'py-6 md:py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-sm border border-red-900/30 flex items-center justify-center bg-red-950/20 shadow-[0_0_15px_rgba(220,38,38,0.15)]">
                                    <RedTieIcon className="w-4 h-4 md:w-5 md:h-5" />
                                </div>
                                <div className="flex flex-col">
                                    <h1 className="text-[12px] md:text-[14px] font-black tracking-[0.3em] uppercase leading-none text-white drop-shadow-md m-0">IMPERIUM</h1>
                                    <span className="text-[8px] md:text-[9px] font-bold tracking-[0.4em] text-brushed-gold uppercase leading-tight mt-1">Barber</span>
                                </div>
                            </div>
                            
                            <nav className="hidden lg:flex gap-10 items-center" aria-label="Navegação Principal">
                                {['A Barbearia', 'Catálogo', 'Arquitetura', 'Coleção'].map((item) => (
                                    <a key={item} href={`#${item.toLowerCase().replace(/\s+/g, '')}`} className="text-[10px] uppercase tracking-[0.3em] text-gray-300 hover:text-[#C5A059] transition-colors focus-visible:outline focus-visible:outline-[#C5A059] p-2">{item}</a>
                                ))}
                                <a
                                    href={generateWALink(WA_MSG)}
                                    className={`btn-gld px-6 py-2.5 rounded-sm text-[9px] uppercase tracking-[0.3em] font-bold shadow-lg transition-all duration-500 ${isPastHero ? 'opacity-100 translate-y-0 pointer-events-auto' : 'opacity-0 -translate-y-2 pointer-events-none'}`}
                                    aria-hidden={!isPastHero}
                                    tabIndex={isPastHero ? 0 : -1}
                                >
                                    Agendar Horário

                            </nav>

                            <button onClick={() => setMobileMenuOpen(true)} className="lg:hidden flex items-center p-2 group" aria-label="Abrir Menu" aria-expanded={mobileMenuOpen}>
                                <div className="p-2 border border-[#C5A059]/30 rounded-full group-hover:border-[#C5A059] transition-all bg-[var(--gld-surface)] focus-visible:outline focus-visible:outline-[#C5A059]">
                                    <i data-lucide="menu" className="w-5 h-5 text-[#C5A059]" aria-hidden="true"></i>
                                </div>
                            </button>
                        </div>
                    </header>

                    {/* MOBILE MENU */}
                    <div className={`fixed inset-0 z-[150] transition-all duration-[800ms] cubic-bezier(0.16, 1, 0.3, 1) ${mobileMenuOpen ? 'opacity-100 visible' : 'opacity-0 invisible'}`} 
                         style={{background: 'rgba(2, 20, 12, 0.98)', backdropFilter: deviceIQ.isLowEnd ? 'none' : 'blur(40px)'}}>
                        <div className="flex justify-end p-6 md:p-10">
                            <button onClick={() => setMobileMenuOpen(false)} aria-label="Fechar Menu" className="p-3 border border-[#C5A059]/50 rounded-full hover:bg-[#C5A059]/20 transition-colors focus-visible:outline focus-visible:outline-[#C5A059]">
                                <i data-lucide="x" className="w-6 h-6 text-[#C5A059]" aria-hidden="true"></i>
                            </button>
                        </div>
                        <nav className="flex flex-col items-center justify-center h-full gap-8 pb-20">
                            <span className="text-[10px] tracking-[0.4em] text-[#C5A059] uppercase mb-4 drop-shadow-lg">Menu</span>
                            {['A BARBEARIA', 'CATÁLOGO', 'ARQUITETURA', 'COLEÇÃO'].map((item, i) => (
                                <a key={item} href={`#${item.toLowerCase().replace(/\s+/g, '')}`} onClick={(e) => { setMobileMenuOpen(false); }} className="text-4xl md:text-5xl font-editorial italic text-white hover:text-[#C5A059] transition-colors focus-visible:outline focus-visible:outline-[#C5A059] p-2" style={{transitionDelay: `${i * 0.1}s`}}>{item}</a>
                            ))}
                        </nav>
                    </div>

                    <main>
                        {/* HERO — Autoridade, sofisticação e conversão */}

                            {/* Camada visual cinematográfica */}
                            <div className="absolute inset-0 z-0" aria-hidden="true">
                                <img
                                    src={HERO_IMAGE}
                                    alt="Cliente na cadeira da barbearia Imperium"
                                    className="hero-bg-img absolute inset-0 w-full h-full select-none"
                                    fetchPriority="high"
                                    decoding="async"
                                />
                                <div className="absolute inset-0 hero-vignette"></div>
                                <div className="absolute inset-0 hero-face-light"></div>
                                <div className="absolute inset-0 bg-[radial-gradient(ellipse_40%_30%_at_75%_45%,rgba(5,150,105,0.1)_0%,transparent_70%)] hidden lg:block"></div>
                                <div className="absolute bottom-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-[#C5A059]/30 to-transparent"></div>
                            </div>

                            {/* Moldura editorial */}
                            <div className="hero-corner hero-corner--tl hidden sm:block" aria-hidden="true"></div>
                            <div className="hero-corner hero-corner--br hidden sm:block" aria-hidden="true"></div>

                            <div className="relative z-20 max-w-7xl mx-auto w-full pt-24 pb-20 sm:pt-28 sm:pb-24 md:pt-32 md:pb-28 lg:py-0">
                                <div className="grid lg:grid-cols-12 gap-8 lg:gap-16 items-center">

                                    {/* Coluna de conversão */}
                                    <div className="lg:col-span-7 reveal-on-scroll flex flex-col items-center lg:items-start text-center lg:text-left">
                                        {/* Retrato mobile — rosto visível */}
                                        <div className="hero-mobile-face lg:hidden" aria-hidden="true">
                                            <img src={HERO_IMAGE} alt="" decoding="async" />
                                        </div>

                                        {/* Chip completo — só desktop/tablet largo */}
                                        <div className="hero-trust-chip hidden md:inline-flex items-center gap-2.5 px-4 py-2 rounded-full mb-6 lg:mb-8">
                                            <span className="text-[8px] md:text-[9px] tracking-[0.35em] uppercase text-[#A7C2B4] font-bold">

                                <nav className="flex flex-col gap-3 md:gap-4 items-center md:items-start" aria-label="Mapa do Site">
                                    {['A Barbearia', 'Catálogo', 'Arquitetura', 'Coleção'].map((link) => (
                                        <a key={link} href={`#${link.toLowerCase().replace(/\s+/g, '')}`} className="text-[10px] md:text-xs uppercase tracking-[0.2em] text-gray-400 hover:text-white transition-colors w-max p-1 focus-visible:outline focus-visible:outline-[#C5A059]">
                                            {link}
                                        </a>
                                    ))}
                                </nav>
                            </div>

                            <div className="md:col-span-4 flex flex-col gap-4 md:gap-6 items-center md:items-start text-center md:text-left">
                                <h4 className="text-[9px] md:text-[10px] tracking-[0.4em] text-[#C5A059] uppercase font-bold">Coordenadas & Contato</h4>
                                <address className="not-italic flex flex-col gap-3 md:gap-4 text-[10px] md:text-xs uppercase tracking-[0.2em] text-gray-400 items-center md:items-start">
                                    <p className="flex flex-col md:flex-row items-center md:items-start gap-2 md:gap-3">
                                        <i data-lucide="map-pin" className="w-4 h-4 text-[#C5A059] shrink-0"></i>
                                        <span>Centro Premium<br/>Chapecó, Santa Catarina<br/>Brasil</span>
                                    </p>
                                    <p className="flex flex-col md:flex-row items-center gap-2 md:gap-3 mt-2">
                                        <i data-lucide="clock" className="w-4 h-4 text-[#C5A059] shrink-0"></i>
                                        <span>Ter a Sáb — 09:00 às 20:00</span>
                                    </p>
                                </address>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto mt-16 md:mt-24 pt-8 border-t border-[var(--emerald-border)] flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
                            <span className="text-[8px] md:text-[9px] tracking-[0.3em] uppercase text-[#A7C2B4]">
                                &copy; 2026 IMPERIUM BARBER. ALL RIGHTS RESERVED.
                            </span>
                            <div className="flex flex-col md:flex-row gap-4 md:gap-8">
                                <a href="#" className="text-[8px] md:text-[9px] tracking-[0.3em] uppercase text-[#A7C2B4] hover:text-[#C5A059] transition-colors p-1 focus-visible:outline focus-visible:outline-[#C5A059]">Política de Privacidade</a>
                                <a href="#" className="text-[8px] md:text-[9px] tracking-[0.3em] uppercase text-[#A7C2B4] hover:text-[#C5A059] transition-colors p-1 focus-visible:outline focus-visible:outline-[#C5A059]">Instagram Oficial</a>
                            </div>
                        </div>
                    </footer>

                    {/* Botão Return to Top */}
                    <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} aria-label="Voltar ao topo" className={`fixed bottom-24 md:bottom-28 right-6 md:right-8 z-[190] w-10 h-10 md:w-12 md:h-12 bg-[var(--gld-surface)] border border-[#C5A059]/30 rounded-full flex items-center justify-center shadow-lg transition-all duration-500 hover:bg-[#C5A059]/10 focus-visible:outline focus-visible:outline-[#C5A059] ${isScrolled ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                        <i data-lucide="chevron-up" className="w-5 h-5 text-[#C5A059]"></i>
                    </button>

                    {/* FAB WhatsApp — mobile só após scroll; desktop sempre visível */}
                    <a
                        href={generateWALink("Olá, quero falar com a equipe da Imperium Barber.")}
                        aria-label="Falar com a equipe pelo WhatsApp"
                        className={`fixed bottom-6 right-6 md:bottom-8 md:right-8 z-[350] bg-[var(--gld-surface)] border border-[#C5A059]/30 backdrop-blur-xl rounded-full px-4 md:px-5 py-3 flex items-center gap-3 shadow-[0_15px_30px_rgba(0,0,0,0.6)] hover:bg-[#C5A059]/10 hover:border-[#C5A059] hover:scale-105 transition-all duration-500 group focus-visible:outline focus-visible:outline-[#C5A059] lg:opacity-100 lg:translate-y-0 lg:pointer-events-auto ${showFab ? 'opacity-100 translate-y-0 pointer-events-auto' : 'max-lg:opacity-0 max-lg:translate-y-8 max-lg:pointer-events-none'}`}
                    >
                        <div className="relative flex items-center justify-center">
                            <i data-lucide="message-circle" className="w-4 h-4 md:w-5 md:h-5 text-[#C5A059]" aria-hidden="true"></i>
                        </div>
                        <div className="flex flex-col text-left">
                            <span className="text-[9px] md:text-[10px] font-bold uppercase tracking-[0.18em] text-[#F4E4C1] whitespace-nowrap group-hover:text-white transition-colors">Falar com a Equipe</span>
                            <span className="text-[7px] md:text-[8px] uppercase tracking-[0.1em] text-[#A7C2B4] whitespace-nowrap">WhatsApp</span>
                        </div>
                    </a>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
